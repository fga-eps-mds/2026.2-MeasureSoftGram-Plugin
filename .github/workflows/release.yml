name: Release & Marketplace (.vsix)

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      # 1. Google Release Please analisa commits convencionais na main e gerencia o PR de release e a Tag oficial
      - uses: googleapis/release-please-action@a02a34c4d625f3be7cf733303cb8287f4c0c5de4 # v4.2.0
        id: release
        with:
          release-type: node

      # 2. Quando o PR de release é mergeado na main, steps abaixo compilam e publicam os artefatos oficiais
      - name: Checkout do código pós-release
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Instalar dependências (extensão e webview)
        if: ${{ steps.release.outputs.release_created }}
        run: npm run install:all

      - name: Compilar extensão e webview
        if: ${{ steps.release.outputs.release_created }}
        run: |
          npm run compile
          npm run build:webview

      - name: Empacotar extensão VS Code (.vsix)
        if: ${{ steps.release.outputs.release_created }}
        run: npx --yes @vscode/vsce package --no-git-tag-version -o "measuresoftgram-${{ steps.release.outputs.version }}.vsix"

      - name: Anexar .vsix à GitHub Release oficial
        if: ${{ steps.release.outputs.release_created }}
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb872386f83bc9b37e28b6a # v2.0.8
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          files: measuresoftgram-${{ steps.release.outputs.version }}.vsix

      - name: Publicar no Visual Studio Marketplace
        if: ${{ steps.release.outputs.release_created && env.VSCE_PAT != '' }}
        run: |
          echo "Publicando no VS Code Marketplace..."
          npx --yes @vscode/vsce publish -p "$VSCE_PAT" --packagePath "measuresoftgram-${{ steps.release.outputs.version }}.vsix"

      - name: Notificação de Marketplace ignorado (Sem segredo configurado)
        if: ${{ steps.release.outputs.release_created && env.VSCE_PAT == '' }}
        run: echo "::notice::Publicação no VS Code Marketplace ignorada (secret VSCE_PAT não configurado no repositório)."
