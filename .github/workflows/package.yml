name: Package & Release Extension (.vsix)

# Retomado da branch feature/release-package-automation (PRs #19/#20) com
# Node 22, npm ci, 'npm run package' e publicação no Marketplace por tag.

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Executar em modo dry-run (não cria release, não anexa assets nem publica)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Instalar dependências da extensão
        run: npm ci

      - name: Instalar dependências da interface
        run: npm ci
        working-directory: webview-ui

      - name: Conferir que a versão do package.json bate com a tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::package.json está em $PKG mas a tag é ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Lint
        run: npm run lint && npm run lint:webview

      - name: Testes unitários da extensão
        run: npm run test:unit

      - name: Testes da interface
        run: npm run test:run
        working-directory: webview-ui

      - name: Empacotar extensão VS Code (.vsix)
        # vscode:prepublish gera a interface e compila a extensão
        run: npm run package

      - name: Identificar artefato gerado
        id: get_vsix
        run: |
          VSIX_NAME=$(ls *.vsix | head -n 1)
          echo "VSIX gerado: $VSIX_NAME ($(ls -lh "$VSIX_NAME" | awk '{print $5}'))"
          echo "vsix_file=$VSIX_NAME" >> "$GITHUB_OUTPUT"

      - name: Conferir conteúdo do pacote
        run: |
          unzip -l "${{ steps.get_vsix.outputs.vsix_file }}" > vsix-contents.txt
          grep -q 'extension/webview-ui/build/assets/index.js' vsix-contents.txt || { echo "::error::interface não está no pacote"; exit 1; }
          if grep -q 'coverage/' vsix-contents.txt; then echo "::error::relatório de cobertura dentro do pacote"; exit 1; fi

      - name: Upload do pacote .vsix como artefato do workflow
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ steps.get_vsix.outputs.vsix_file }}
          path: ${{ steps.get_vsix.outputs.vsix_file }}

      - name: Anexar .vsix à GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release') && inputs.dry_run != true
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb872386f83bc9b37e28b6a # v2.0.8
        with:
          generate_release_notes: true
          files: ${{ steps.get_vsix.outputs.vsix_file }}

      - name: Publicar no VS Code Marketplace
        # Exige o secret VSCE_PAT (ver docs/SECRETS.md). Publicação sai daqui,
        # nunca de máquina pessoal.
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT não configurado; pulando publicação no Marketplace"
            exit 0
          fi
          npx --yes @vscode/vsce publish --packagePath "${{ steps.get_vsix.outputs.vsix_file }}" -p "$VSCE_PAT"
