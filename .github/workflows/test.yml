name: Rodar Testes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20.x

      - name: Instalar dependências (extensão e webview)
        run: npm run install:all

      - name: Compilar extensão e webview
        run: |
          npm run compile
          npm run build:webview

      - name: Rodar Linter
        run: npm run lint

      - name: Rodar testes da extensão com cobertura
        run: npm run test:coverage

      - name: Rodar testes da webview com cobertura
        run: cd webview-ui && npm run test:coverage

      - name: Gerar metadados do PR / Execução
        run: |
          mkdir -p pr_metadata
          cat << 'EOF' > pr_metadata/metadata.json
          {
            "event_name": "${{ github.event_name }}",
            "pr_number": "${{ github.event.pull_request.number }}",
            "head_ref": "${{ github.event.pull_request.head.ref || github.ref_name }}",
            "head_repo": "${{ github.event.pull_request.head.repo.full_name || github.repository }}",
            "head_sha": "${{ github.event.pull_request.head.sha || github.sha }}",
            "base_ref": "${{ github.event.pull_request.base.ref || github.ref_name }}"
          }
          EOF

      - name: Upload de artefatos de cobertura e metadados
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: test-coverage-artifacts
          path: |
            coverage/lcov.info
            webview-ui/coverage/lcov.info
            pr_metadata/metadata.json
          retention-days: 1

      - name: Scanner do SonarCloud (Fallback para contexto com secrets)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.organization=fga-eps-mds-1

      - name: Notificação de SonarCloud desacoplado
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN não disponível neste contexto (PR de fork). Testes concluídos com sucesso e artefatos salvos para a esteira do SonarCloud."