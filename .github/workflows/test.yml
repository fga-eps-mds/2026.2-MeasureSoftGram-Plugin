name: Rodar Testes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
       uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Instalar dependências da extensão
        run: npm ci

      - name: Instalar dependências da interface
        run: npm ci
        working-directory: webview-ui

      - name: Lint da extensão
        run: npm run lint

      - name: Lint da interface
        run: npm run lint:webview

      - name: Compilar extensão
        run: npm run compile

      - name: Build da interface
        run: npm run build:webview

      - name: Testes da extensão com cobertura
        run: npm run test:coverage

      - name: Rodar testes da webview com cobertura
        run: cd webview-ui && npm run test:coverage

      - name: Validar empacotamento da extensão (.vsix)
        run: npx --yes @vscode/vsce package --no-git-tag-version

      - name: SonarCloud Scanner
        # O SonarCloud só deve ser executado se:
        # 1. Não for disparado pelo Dependabot (que não possui acesso aos secrets de Actions)
        # 2. O evento for push (merge) OU um PR interno do próprio repositório (não fork externo)
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        # 'sonar.qualitygate.wait=true' pausa a execução do step e consulta a API do SonarCloud
        # até a conclusão da análise. Se o Quality Gate for reprovado (cobertura insuficiente, bugs,
        # code smells), o scanner encerra com código de erro diferente de zero e quebra o CI na hora.
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.qualitygate.wait=true

      - name: Aviso de SonarCloud ignorado (Pull Request externo ou Dependabot)
        if: >-
          github.actor == 'dependabot[bot]' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name != github.repository)
        run: echo "::notice::Execução em fork externo ou ator Dependabot sem acesso aos secrets. Análise do SonarCloud ignorada com segurança."
