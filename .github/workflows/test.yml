name: Rodar Testes
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm run install:all
      - name: Compilar extensão
        run: npm run compile
      - name: Compilar frontend da webview
        run: npm run build:webview
      - name: Validar empacotamento da extensão (.vsix)
        run: npx --yes @vscode/vsce package --no-git-tag-version && rm -f *.vsix
      - name: Rodar testes da extensão com cobertura
        run: npm run test:coverage
      - name: Rodar testes da webview com cobertura
        run: cd webview-ui && npm run test:coverage
      - name: Scanner do SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.projectName=${{ github.event.repository.name }}