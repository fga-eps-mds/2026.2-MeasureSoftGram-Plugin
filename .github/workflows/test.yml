name: Rodar Testes
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Instalar dependências da extensão
        run: npm ci

      - name: Instalar dependências da interface
        run: npm ci
        working-directory: webview-ui

      - name: Lint da extensão
        run: npm run lint

      - name: Lint da interface
        run: npm run lint:webview

      - name: Compilar extensão
        run: npm run compile

      - name: Build da interface
        run: npm run build:webview

      - name: Testes da extensão com cobertura
        run: npm run test:coverage

      - name: Testes da interface com cobertura
        run: npm run test:coverage
        working-directory: webview-ui

      - name: Teste de integração em VS Code real
        run: xvfb-run -a npm run test:integration

      - name: Scanner do SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.projectName=${{ github.event.repository.name }}
